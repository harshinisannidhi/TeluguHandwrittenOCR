<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register · Telugu OCR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#070b1c;--card:rgba(12,18,42,.78);--card2:rgba(20,28,62,.7);--line:rgba(255,255,255,.13);
--text:#eef1ff;--muted:#aab3d8;--gold:#f5a524;--gold2:#ffd27a;--teal:#2dd4bf;--rose:#fb7185;--green:#34d399;--radius:18px;
--tel:'Noto Sans Telugu','Nirmala UI','Gautami','Mandali',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins','Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh;
background-color:var(--bg);display:flex;flex-direction:column;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--gold2);text-decoration:none}
a:hover{color:#fff}
.tel{font-family:var(--tel)}
/* ---------- navbar ---------- */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;
padding:12px 28px;background:rgba(7,11,28,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;color:#fff;letter-spacing:.2px}
.brand b{color:var(--gold)}
.brand-glyph{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-family:var(--tel);font-size:1.4rem;
color:#1b1200;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 6px 18px rgba(245,165,36,.35)}
.links{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.links a{padding:8px 14px;border-radius:10px;color:var(--muted);font-weight:500;font-size:.93rem;transition:.2s}
.links a:hover{color:#fff;background:rgba(255,255,255,.08)}
.links a.active{color:#1b1200;background:linear-gradient(135deg,var(--gold2),var(--gold))}
.links a.cta{border:1px solid var(--gold);color:var(--gold2)}
.burger{display:none;background:none;border:1px solid var(--line);color:#fff;font-size:1.3rem;border-radius:10px;padding:4px 12px;cursor:pointer}
@media(max-width:820px){.burger{display:block}.links{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;
align-items:stretch;padding:12px 20px 18px;background:rgba(7,11,28,.96);border-bottom:1px solid var(--line)}
.nav.open .links{display:flex}}
/* ---------- layout ---------- */
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:34px 22px 64px;flex:1}
.page-title{font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:700;line-height:1.2;margin-bottom:6px}
.page-title span{background:linear-gradient(90deg,var(--gold2),var(--gold),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);max-width:760px;margin-bottom:26px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;
backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h2{font-size:1.15rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.card h2 i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:rgba(245,165,36,.16);font-size:1rem}
.card p{color:var(--muted);font-size:.95rem}
.section{margin-top:30px}
.section>h2{font-size:1.3rem;margin-bottom:14px}
/* ---------- buttons / badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:12px;font-weight:600;
font-size:.97rem;border:1px solid transparent;cursor:pointer;transition:.2s;font-family:inherit}
.btn-gold{color:#1b1200;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 10px 26px rgba(245,165,36,.35)}
.btn-gold:hover{transform:translateY(-2px);color:#1b1200;box-shadow:0 14px 32px rgba(245,165,36,.5)}
.btn-ghost{color:#fff;border-color:var(--line);background:rgba(255,255,255,.05)}
.btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff}
.badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.74rem;font-weight:600;letter-spacing:.3px;
background:rgba(255,255,255,.1);color:var(--muted);border:1px solid var(--line)}
.badge.ok{background:rgba(52,211,153,.16);color:var(--green);border-color:rgba(52,211,153,.4)}
.badge.warn{background:rgba(245,165,36,.16);color:var(--gold2);border-color:rgba(245,165,36,.45)}
.badge.bad{background:rgba(251,113,133,.16);color:var(--rose);border-color:rgba(251,113,133,.45)}
.badge.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b1200;border:none}
/* ---------- forms ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:.84rem;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input[type=email],.field input[type=password],.field input[type=text]{width:100%;padding:13px 15px;border-radius:12px;
border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font-size:1rem;font-family:inherit;outline:none;transition:.2s}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,165,36,.22);background:rgba(255,255,255,.1)}
.alert{padding:13px 16px;border-radius:12px;margin-bottom:18px;font-size:.93rem;border:1px solid}
.alert.err{background:rgba(251,113,133,.13);border-color:rgba(251,113,133,.5);color:#ffd0d7}
.alert.info{background:rgba(245,165,36,.12);border-color:rgba(245,165,36,.45);color:var(--gold2)}
/* ---------- tables / bars ---------- */
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:640px}
.tbl th{text-align:left;padding:11px 14px;background:rgba(245,165,36,.14);color:var(--gold2);font-weight:600;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:10px 14px;border-top:1px solid var(--line);white-space:nowrap}
.tbl tr:hover td{background:rgba(255,255,255,.05)}
.tbl tr.me td{background:rgba(245,165,36,.1)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bar.teal>span{background:linear-gradient(90deg,#14b8a6,var(--teal))}
.bar.rose>span{background:linear-gradient(90deg,#f43f5e,var(--rose))}
/* ---------- flow ---------- */
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.flow .st{flex:1 1 150px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.flow .st b{display:block;font-size:.92rem;margin-bottom:2px}
.flow .st small{color:var(--muted);font-size:.8rem;line-height:1.35;display:block}
.flow .st .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#1b1200;font-weight:700;font-size:.78rem;margin-bottom:8px}
/* ---------- footer ---------- */
.foot{text-align:center;padding:22px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);background:rgba(7,11,28,.7);backdrop-filter:blur(8px)}

fill-opacity%3D%270.21%27%20transform%3D%27rotate%287%20121%20165%29%27%3E%26%23x0C1C%3B%3C%2Ftext%3E%3Ctext%20x%3D%27146%27%20y%3D%27167%27%20font-size%3D%2756%27%20fill%3D%27%23ffd27a%27%20fill-opacity%3D%270.21%27%20transform%3D%27rotate%288%20146%20167%29%27%3E%26%23x0C1F%3B%3C%2Ftext%3E%3Ctext%20x%3D%27300%27%20y%3D%2790%27%20font-size%3D%2744%27%20fill%3D%27%23ffffff%27%20fill-opacity%3D%270.13%27%20transform%3D%27rotate%28-7%20300%2090%29%27%3E%26%23x0C21%3B%3C%2Ftext%3E%3Ctext%20x%3D%27124%27%20y%3D%27135%27%20font-size%3D%2784%27%20fill%3D%27%23f5a524%27%20fill-opacity%3D%270.21%27%20transform%3D%27rotate%28-17%20124%20135%29%27%3E%26%23x0C24%3B%3C%2Ftext%3E%3Ctext%20x%3D%27291%27%20y%3D%27284%27%20font-size%3D%2756%27%20fill%3D%27%23fb7185%27%20fill-opacity%3D%270.21%27%20transform%3D%27rotate%28-5%20291%20284%29%27%3E%26%23x0C26%3B%3C%2Ftext%3E%3Ctext%20x%3D%27208%27%20y%3D%27159%27%20font-size%3D%2768%27%20fill%3D%27%23fb7185%27%20fill-opacity%3D%270.13%27%20transform%3D%27rotate%28-4%20208%20159%29%27%3E%26%23x0C28%3B%3C%2Ftext%3E%3Ctext%20x%3D%27154%27%20y%3D%27232%27%20font-size%3D%2768%27%20fill%3D%27%23ffd27a%27%20fill-opacity%3D%270.17%27%20transform%3D%27rotate%283%20154%20232%29%27%3E%26%23x0C2A%3B%3C%2Ftext%3E%3Ctext%20x%3D%27266%27%20y%3D%27391%27%20font-size%3D%2768%27%20fill%3D%27%23f5a524%27%20fill-opacity%3D%270.17%27%20transform%3D%27rotate%28-5%20266%20391%29%27%3E%26%23x0C2C%3B%3C%2Ftext%3E%3Ccircle%20cx%3D%27468%27%20cy%3D%27100%27%20r%3D%274%27%20fill%3D%27%23f5a524%27%20fill-opacity%3D%270.35%27%2F%3E%3Ccircle%20cx%3D%27329%27%20cy%3D%27489%27%20r%3D%274%27%20fill%3D%27%23f5a524%27%20fill-opacity%3D%270.35%27%2F%3E%3Ccircle%20cx%3D%27439%27%20cy%3D%27355%27%20r%3D%273%27%20fill%3D%27%23f5a524%27%20fill-opacity%3D%270.35%27%2F%3E%3Ccircle%20cx%3D%2757%27%20cy%3D%2798%27%20r%3D%272%27%20fill%3D%27%23f5a524%27%20fill-opacity%3D%270.35%27%2F%3E%3Ccircle%20cx%3D%2724%27%20cy%3D%27481%27%20r%3D%274%27%20fill%3D%27%23f5a524%27%20fill-opacity%3D%270.35%27%2F%3E%3Ccircle%20cx%3D%27201%27%20cy%3D%27366%27%20r%3D%272%27%20fill%3D%27%23f5a524%27%20fill-opacity%3D%270.35%27%2F%3E%3Ccircle%20cx%3D%27352%27%20cy%3D%27214%27%20r%3D%273%27%20fill%3D%27%23f5a524%27%20fill-opacity%3D%270.35%27%2F%3E%3Ccircle%20cx%3D%27475%27%20cy%3D%27166%27%20r%3D%274%27%20fill%3D%27%23f5a524%27%20fill-opacity%3D%270.35%27%2F%3E%3C%2Fsvg%3E"),radial-gradient(900px 520px at 8% 0%, rgba(45,212,191,.2), transparent 60%),radial-gradient(800px 520px at 100% 100%, rgba(245,165,36,.16), transparent 60%),linear-gradient(160deg,#070b1c 0%,#0d1433 55%,#120f2b 100%);background-repeat:no-repeat,repeat,no-repeat,no-repeat,no-repeat;background-position:left -160px bottom -220px,0 0,0 0,0 0,0 0;background-size:min(760px,95vw) auto,520px 520px,auto,auto,cover;background-attachment:fixed;}

.auth{flex:1;display:grid;place-items:center;padding:40px 18px}
.auth-card{width:100%;max-width:440px;padding:34px 32px}
.auth-card .ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px;font-family:var(--tel);
font-size:2.2rem;color:#1b1200;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 12px 30px rgba(245,165,36,.4)}
.auth-card h1{text-align:center;font-size:1.6rem;margin-bottom:4px}
.auth-card .sub{text-align:center;margin:0 auto 22px;font-size:.93rem}
.auth-card .btn{width:100%}
.alt{text-align:center;margin-top:18px;color:var(--muted);font-size:.92rem}

</style>
</head>
<body>
<header class="nav" id="topnav">
  <a class="brand" href="{{ url_for('index') }}"><span class="brand-glyph">అ</span><span>Telugu<b>OCR</b></span></a>
  <button class="burger" aria-label="Menu" onclick="document.getElementById('topnav').classList.toggle('open')">&#9776;</button>
  <nav class="links">
    <a href="{{ url_for('index') }}" class="active">Home</a>
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('login') }}">Login</a>
    <a href="{{ url_for('register') }}" class="cta">Register</a>
  </nav>
</header>

<main class="auth">
  <div class="card auth-card">
    <div class="ico">ఆ</div>
    <h1>Create your account</h1>
    <p class="sub">Register to start converting handwriting into Telugu Unicode text.</p>
    {% if message %}<div class="alert err">{{ message }}</div>{% endif %}
    <form method="POST" action="{{ url_for('register') }}">
      <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@example.com" required autofocus></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" placeholder="Choose a password" required></div>
      <div class="field"><label for="c_password">Confirm password</label><input type="password" id="c_password" name="c_password" placeholder="Repeat password" required></div>
      <button class="btn btn-gold" type="submit">Register</button>
    </form>
    <p class="alt">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</main>

<footer class="foot">Telugu Handwritten Character OCR &middot; SGF-MobileNetV3 &middot; Stroke-Gated Feature Fusion &middot; &copy; 2026</footer>

</body>
</html>
